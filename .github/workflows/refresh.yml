name: refresh-hub

on:
  workflow_dispatch: {}       # triggered every 15 min by external cron (cron-job.org) via the API;
                              # GitHub's own schedule was removed — it was throttled/unreliable

permissions:
  contents: write             # allow the job to commit the updated data.json

concurrency:
  group: refresh-hub
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python collector.py

      - name: commit updated data
        run: |
          git config user.name  "media-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "hub: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
